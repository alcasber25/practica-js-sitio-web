<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio: Galería Dinámica con Header Aleatorio</title>
    <link rel="stylesheet" href="css/main.css"/>
</head>

<body>

<!-- HEADER -->
    
<header class="contenedorHeader">
        <div class="textoHeader">
        <p>Mira muchas fotos</p>
        </div>
        <img id="imagenHeader" src="" alt="Imagen de header aleatoria">
        </header>
 
    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenedor">
        <section class="seccionGaleria">
            <h2 class="tituloSeccion">Nuestros destinos de viaje</h2>
            <p class="descripcionSeccion">Una colección de fotos y textos</p>
            <div id="galeria" class="galeria">
            </div>
        </section>
    </main>
 
<!-- FOOTER -->  
<footer class="footer">
    <p>Este es el footer</p>
</footer>

<script src="js/main.js"></script>
</body>
